# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: CI Build

env:
  JAVA_VERSION: 21

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  CI-Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{env.JAVA_VERSION}}
        uses: actions/setup-java@v6
        with:
          java-version: ${{env.JAVA_VERSION}}
          distribution: 'zulu'
          cache: maven
      # detekt with its defaults; config/detekt/baseline.xml holds the findings accepted when it was added.
      - name: Lint Kotlin (detekt)
        uses: hononeko/actions/lint-kotlin@v1
      - name: Build with Maven
        run: mvn -B compile --file pom.xml
      - name: Run Unit Tests
        run: mvn -B verify -Pcoverage
      # Overall coverage is reported; a pull request's changed lines must be 80% covered.
      - name: Coverage
        uses: hononeko/actions/coverage@v1
        with:
          files: target/site/jacoco/jacoco.xml
          min-changed-coverage: "80"
